[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "som-mcp"
version = "0.1.0"
description = "MCP server for Som algorithm workbench"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.6.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
