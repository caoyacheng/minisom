name: Codestyle + Unit-Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install numpy numba flake8 pycodestyle pytest pytest-cov
        pip install -r backend/requirements.txt
    - name: Lint with flake8
      run: |
        MINISOM=backend/app/models/som/vendor/minisom.py
        flake8 "$MINISOM" --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 "$MINISOM" --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Checking style
      run: |
        pycodestyle backend/app/models/som/vendor/minisom.py
    - name: Unit testing
      env:
        PYTHONPATH: backend/app/models/som/vendor
      run: |
        pytest --cov=minisom backend/app/models/som/vendor/minisom.py
